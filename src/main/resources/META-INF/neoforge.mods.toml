modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Player-accessible shop configurable by modpack developers and server owners!
Can buy and sell Items and Fluids
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Every Account belongs to an FTB Team.
[[dependencies.${mod_id}]]
    modId="ftbteams"
    type="required"
    versionRange="[${ftb_teams_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ftblibrary"
    type="required"
    versionRange="[${ftb_library_version},)"
    ordering="AFTER"
    side="BOTH"

# Optional: Patchouli shows the Econ Handbook and enables its recipe.
[[dependencies.${mod_id}]]
    modId="patchouli"
    type="optional"
    versionRange="[26.1-94,)"
    ordering="NONE"
    side="BOTH"

# Optional: JEI shows the Shop's Offers. From the JEI AdminShop is built against.
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[${jei_version},)"
    ordering="NONE"
    side="BOTH"

# Optional: EMI shows the Shop's Offers. From the EMI AdminShop is built against.
[[dependencies.${mod_id}]]
    modId="emi"
    type="optional"
    versionRange="[${emi_mod_version},)"
    ordering="NONE"
    side="BOTH"
