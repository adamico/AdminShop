plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 26.1 runs on Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// The 1.21.1 sources in legacy-1.21.1/ are reference only: no source set names them, so they are
// neither compiled nor packaged.

// The game tests and their resources: loaded by the mod's own runs, never part of the jar.
sourceSets {
    gametest
}

configurations {
    // Mods on the dev runs' classpath that the published jar does not depend on.
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
    gametestImplementation.extendsFrom implementation
    gametestRuntimeClasspath.extendsFrom localRuntime
    // Optional mods the client and server runs load and the game test server, which runs from the
    // gametest source set, doesn't.
    optionalRuntime
    runtimeClasspath.extendsFrom optionalRuntime
}

repositories {
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases'
        content { includeGroup 'dev.ftb.mods' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // Accounts belong to FTB Teams, which needs FTB Library. Each NeoForge jar already holds its common
    // classes (and FTB Library its json5 library, in jar), so the separate common jars stay off the
    // classpath: on it they would put every package there twice.
    implementation("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
    implementation("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive = false }

    // Patchouli backs only the Econ Handbook's data and recipe, so it is optional (ADR-0002) and no code
    // compiles against it. It loads in the client and server runs only: the game tests run without it.
    optionalRuntime("maven.modrinth:patchouli:${patchouli_version}")

    gametestImplementation sourceSets.main.output

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def gameTestReport = layout.buildDirectory.file('reports/gametest.xml')

neoForge {
    version = neo_version

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
        }
        client {
            client()
            // The same player every launch, so a dev save keeps its inventory and position.
            programArguments.addAll '--username', 'Developer', '--uuid', '123456781234123412341234567890ab'
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Headless: runs AdminShop's game tests, writes a JUnit report and exits.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run/gametest')
            // Its classpath leaves out the optional mods.
            sourceSet = sourceSets.gametest
            programArguments.addAll '--tests', "${mod_id}:*", '--report', gameTestReport.get().asFile.absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }

    addModdingDependenciesTo sourceSets.gametest

    // JUnit under FML, so Offers can be decoded with the game's registries and AdminShop's recipe types.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// The report, not the exit code, decides, and names each test: a run that ran none fails.
tasks.named('runGameTestServer') {
    def report = gameTestReport.get().asFile
    ignoreExitValue = true
    doFirst {
        report.delete()
        report.parentFile.mkdirs()
    }
    doLast { task ->
        if (!report.exists()) throw new GradleException("The game test server wrote no report at $report")
        def cases = new groovy.xml.XmlSlurper().parse(report).'**'.findAll { it.name() == 'testcase' }
        if (cases.isEmpty()) throw new GradleException('The game test server ran no tests')
        cases.each { task.logger.lifecycle("${it.failure.size() ? 'FAILED' : 'passed'}  ${it.@name}") }
        def failed = cases.count { it.failure.size() }
        if (failed) throw new GradleException("$failed of ${cases.size()} game tests failed")
    }
}

// The JUnit tests run under FML with the registries bootstrapped but no world: they test what reads no
// world state, and the game tests the rest.
tasks.named('test', Test) {
    useJUnitPlatform()
    systemProperty 'adminshop.gradleProperties', file('gradle.properties').absolutePath
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            ftb_teams_version      : ftb_teams_version,
            ftb_library_version    : ftb_library_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"   : mod_id,
                "Specification-Vendor"  : mod_authors,
                "Specification-Version" : "1",
                "Implementation-Title"  : project.name,
                "Implementation-Version": project.version,
                "Implementation-Vendor" : mod_authors,
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
