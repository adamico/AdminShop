# Builds AdminShop, runs the JUnit tests and runs the game tests on a headless server, on every push
# and pull request. It never publishes: releases are cut by hand as GitHub Releases on the fork.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # The build, with the JUnit tests.
      - run: ./gradlew build

      # A headless server that runs the game tests and names each one; it fails if it ran none.
      - run: ./gradlew runGameTestServer

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-report
          path: |
            build/reports/gametest.xml
            build/reports/tests/
            run/gametest/logs/
          if-no-files-found: ignore
